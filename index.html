button,.btn{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--ac2);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .12s,opacity .12s}
button:active,.btn:active{transform:scale(.96)}

input,textarea,select{width:100%;font:inherit;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 10px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
.search{position:relative}.search svg{position:absolute;left:14px;top:16px;width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round}.search .clr{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--line);color:var(--tx);font-size:20px;line-height:1;align-items:center;justify-content:center;padding:0;cursor:pointer}.search input{padding-left:42px;padding-right:46px;border-radius:999px;background:var(--card)}

nav a .dot{position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-weight:600}

.hero{text-align:center;padding:70px 16px 24px}

.hero h1{font-size:40px;margin:0 0 8px;letter-spacing:-1px}.hero p{color:var(--mut);margin:0 auto 24px;max-width:420px}

.gbtn{background:#fff;color:#3c4043;display:inline-flex;gap:12px;align-items:center;padding:12px 22px 12px 14px;font-size:16px;font-weight:600;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}

.toast.err{border-color:var(--bad);color:var(--bad)}
ol{padding-left:20px;color:var(--mut);font-size:14px}ol li{margin:6px 0}
.empty{text-align:center;color:var(--mut);padding:36px 0}.empty svg{width:48px;height:48px;stroke:var(--mut);fill:none;stroke-width:1.5;display:block;margin:0 auto 10px;opacity:.7}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;scroll-snap-type:x mandatory}.thumbs img{height:260px;border-radius:14px;border:1px solid var(--line);scroll-snap-align:start;flex:none;background:var(--bg2)}.pv{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.pv div{position:relative}.pv img{width:70px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.pv b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px;cursor:pointer}.back{background:transparent;color:var(--ac);padding:8px 0;font-weight:700}.card.tap{cursor:pointer}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.splash .big{width:96px;height:96px;border-radius:24px;background:#0f172a;color:#34d399;display:grid;place-items:center;font-size:42px;font-weight:900;border:1px solid #1e293b}.splash .sn{font-size:26px;font-weight:800;letter-spacing:-.5px}.splash .sn{font-size:30px;letter-spacing:4px;min-height:40px}.splash .sn b{color:var(--ac)}.cur{display:inline-block;width:3px;height:28px;background:var(--ac);margin-left:4px;vertical-align:-4px;animation:blink .7s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ad{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:5;max-width:520px;margin:0 auto;padding:0 12px}.ad .adl{display:block;font-size:10px;color:var(--mut);text-align:center}
.sw{flex:none;width:50px;height:30px;border-radius:999px;border:0;padding:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s}.sw .kn{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}.sw.on{background:var(--ac)}.sw.on .kn{transform:translateX(20px)}.sw:disabled{opacity:.6}
.tacts{flex-wrap:wrap}.tacts .sec{flex:1 1 0;min-width:0}.tacts .pri{flex:1 1 100%;order:-1}
.view{animation:fade .22s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
.fbm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}.fbm.me{border-color:var(--ac)}.fbl{margin:6px 0}
.how summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}.how summary::-webkit-details-marker{display:none}.how summary::after{content:'';width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;margin-right:4px}.how[open] summary::after{transform:rotate(-135deg)}
.fab{position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:7;border:0;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:800;color:#eefbf6;background:var(--grad);box-shadow:0 8px 22px rgba(0,0,0,.4);cursor:pointer}
.pen{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mut);display:grid;place-items:center;padding:0;cursor:pointer}.sec.sm{padding:6px 12px;font-size:13px;border-radius:12px;min-height:0}
.fmc{max-height:90vh;max-width:460px;display:flex;flex-direction:column;padding:0;overflow:hidden}.fscroll{overflow-y:auto;padding:18px;flex:1}.ffoot{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card2)}.ffoot .pri{width:100%}.fcont label{display:block;font-size:13px;color:var(--mut);margin-top:4px}.lg{position:relative;width:84px;height:84px;border-radius:20px;border:1px dashed var(--line);background:var(--bg2);color:var(--mut);padding:0;display:grid;place-items:center;cursor:pointer;margin-top:4px}.lg img{width:100%;height:100%;object-fit:cover;border-radius:19px}.lgpen{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#05261b;display:grid;place-items:center}.bub{position:absolute;left:0;top:94px;z-index:30;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 10px 26px var(--sh);min-width:140px}.bub button{border:0;background:var(--bg2);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit;text-align:left;cursor:pointer}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--grad);color:#eefbf6;border-color:transparent;font-weight:700}
.xbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:22px;line-height:1;padding:0;cursor:pointer;display:grid;place-items:center}
.thumbs-sm img{height:150px}
.pri.sm{padding:8px 18px;font-size:14px;border-radius:12px}

/* ===== Responsivo: celular, tablet e computador ===== */
img{max-width:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.name,h2{overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.lst>.empty{grid-column:1/-1}

/* celulares pequenos */
@media(max-width:380px){
  .logo{font-size:20px}.pts{padding:5px 10px;font-size:13px}
  h2{font-size:22px}.hero h1{font-size:34px}.hero{padding-top:48px}
  nav{padding-left:6px;padding-right:6px}nav a{font-size:10px}nav a svg{width:22px;height:22px}
  .stats{gap:6px}.stat b{font-size:20px}.stat{padding:10px 6px}
  .thumbs img{height:220px}.fab{right:12px;padding:12px 16px;font-size:15px}
  .card{padding:12px}.ico{width:48px;height:48px;font-size:20px}
}
/* celular deitado */
@media(max-height:480px) and (orientation:landscape){
  .hero{padding-top:20px}.hero .big{width:64px;height:64px;font-size:28px;margin-bottom:10px}
  nav a{flex-direction:row;justify-content:center;gap:6px;padding:6px 2px}
  .fab{bottom:calc(70px + env(safe-area-inset-bottom))}.toast{bottom:76px}body{padding-bottom:84px}
}
/* tablet */
@media(min-width:700px){
  .wrap{max-width:760px;padding-left:24px;padding-right:24px}
  .mdl{max-width:480px}.fmc{max-width:520px}
  .lst,.v-tests,.v-mine{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;align-items:start}
  .v-tests>*,.v-mine>*{grid-column:1/-1}
  .v-tests>.card:not(.how),.v-mine>.card:not(.how){grid-column:auto}
  .v-mine>.card:has(.fcont){grid-column:1/-1}
  .thumbs img{height:300px}
}
/* computador */
@media(min-width:1024px){
  .wrap{max-width:1120px;padding-left:32px;padding-right:32px}
  .wrap.hero{max-width:760px;padding-top:100px}.hero p,.hero .steps{max-width:520px}
  .v-me,.v-detail{max-width:780px}
  .lst,.v-tests,.v-mine{grid-template-columns:repeat(3,minmax(0,1fr))}
  .v-detail .thumbs img{height:360px}
  h2{font-size:28px;margin-top:26px}
  /* menu vai para o topo, no meio da barra */
  nav{top:0;bottom:auto;height:60px;padding:0;display:flex;align-items:center;justify-content:center}
  nav .bar2{max-width:460px;padding:4px;border-radius:16px;box-shadow:none;background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
  nav a{flex-direction:row;gap:8px;padding:9px 16px;font-size:14px;border-radius:12px;white-space:nowrap}
  nav a svg{width:20px;height:20px}
  nav a .dot{top:-3px;right:-2px}
  .fab{right:28px;bottom:calc(28px + env(safe-area-inset-bottom))}
  .toast{bottom:32px}.ad{bottom:0;max-width:728px}
  body{padding-bottom:90px}
}
@media(min-width:1500px){
  .wrap{max-width:1280px}
  .lst,.v-tests,.v-mine{grid-template-columns:repeat(4,minmax(0,1fr))}
}
/* mouse: efeito ao passar por cima */
@media(hover:hover){
  .card{transition:border-color .15s,transform .15s}
  .card.tap:hover{border-color:var(--ac);transform:translateY(-2px)}
  button:not(:disabled):hover,.btn:hover{opacity:.9}
  nav a:not(.on):hover{color:var(--tx);background:rgba(142,160,189,.14)}
  .chip:hover{border-color:var(--ac);color:var(--tx)}
}
</style>
